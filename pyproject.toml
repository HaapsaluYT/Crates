[project]
name = "crates"
keywords = ["packs", "fun", "configurable"]
version = "0.2.0"
description = "A Ballsdex package for crates, also referred to as packs."
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Cayla", email = "official.dotzz@gmail.com" },
]
requires-python = ">=3.13"
readme = "README.md"

dependencies = [
    "query-builder-widget",
]

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]

docs = [
    "markdown-grid-tables>=0.6.0",
    "mkdocs-material>=9.7.7",
]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py313"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E203"]

[tool.ruff.lint.isort]
known-first-party = ["ballsdex", "bd_models", "settings"]
split-on-trailing-comma = false

[tool.uv.sources]
query-builder-widget = { git = "https://github.com/Caylies/QueryBuilderWidget", rev = "1.2.1" }

[project.urls]
Homepage = "https://caylies.github.io/Crates/"
Documentation = "https://caylies.github.io/Crates/"
Changelogs = "https://caylies.github.io/Crates/changelog"
Funding = "https://ko-fi.com/caylies"
